services:
  - type: web
    name: agriguard-ai-demo
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24.x"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
